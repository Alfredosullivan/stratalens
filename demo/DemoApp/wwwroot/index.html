<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo instrumentado — Stratalens</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    pre { background: #f4f4f5; padding: 1rem; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Demo instrumentado</h1>
  <p>Este "frontend" mínimo llama al backend, que consulta Postgres. Cada request genera
     un trace de OpenTelemetry (span del backend → span de la query SQL) exportado por
     OTLP a Stratalens.</p>
  <button id="btn">Pedir /pedidos</button>
  <pre id="out">Pulsa el botón…</pre>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'Cargando…';
      try {
        const res = await fetch('/pedidos');
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (err) {
        out.textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
