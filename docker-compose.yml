# Postgres local para desarrollo. Levantar con: docker compose up -d
# Las credenciales se leen de .env (no versionado). Ver .env.example.
services:
  postgres:
    image: postgres:18-alpine
    container_name: stratalens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Puerto 5433 en el host (5432 puede estar ocupado por otro proyecto).
      - "5433:5432"
    volumes:
      - observability_map_pgdata:/var/lib/postgresql/data
    healthcheck:
      # El contenedor no se marca "healthy" hasta que Postgres acepta conexiones.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  observability_map_pgdata:
