name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Sin Node, el test de integración de ReactTypeScriptAnalyzer que invoca el
      # subproceso real (analyze.mjs) hace soft-skip en vez de correr de verdad.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # analyze.mjs depende de "typescript" (ver analyzers-node/package.json) — sin
      # instalar, el subproceso real muere con ERR_MODULE_NOT_FOUND.
      - name: Install analyzers-node dependencies
        working-directory: analyzers-node
        run: npm ci

      - name: Restore
        run: dotnet restore backend/Stratalens.slnx

      - name: Build
        run: dotnet build backend/Stratalens.slnx --no-restore --configuration Release

      # Testcontainers levanta Postgres real vía Docker (ya disponible en el runner).
      - name: Test
        run: dotnet test backend/Stratalens.slnx --no-build --configuration Release

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
